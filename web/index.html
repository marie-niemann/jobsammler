<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maries Jobs</title>
<meta name="description" content="Täglich gesammelte Stellen für Moderation, Host und Entertainment">
<meta name="theme-color" content="#1d1b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jobs">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ef; --surface:#ffffff; --ink:#1d1b2e; --muted:#6b6878; --line:#e7e2d9;
  --accent:#e4572e; --accent-soft:#fde8e1; --new:#2f8f5b; --new-soft:#e1f3e8;
  --warn:#9a6a00; --warn-soft:#fdf1d6; --star:#f2a900; --done:#4a5bd4; --done-soft:#e6e9fb;
  --shadow:0 1px 2px rgba(29,27,46,.06),0 4px 16px rgba(29,27,46,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14131d; --surface:#1e1c2b; --ink:#f3f1ec; --muted:#a3a0b2; --line:#2e2b3f;
  --accent:#ff7a52; --accent-soft:#3a2420; --new:#5fd394; --new-soft:#1b3326;
  --warn:#f0c058; --warn-soft:#3a2f14; --star:#ffc93c; --done:#8d9bff; --done-soft:#262a4a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header{padding:28px 0 8px}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0 6px;max-width:520px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:Fraunces,Georgia,serif;font-size:24px;line-height:1.1}
.stat small{color:var(--muted);font-size:12px}
.controls{background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
@media (min-width:700px){.controls{position:sticky;top:0;z-index:5}}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row select,.row input{flex:1 1 150px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 10px;font:14px Inter,sans-serif}
h2{font-family:Fraunces,Georgia,serif;font-size:20px;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
h2 .count{font:500 13px Inter,sans-serif;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin-bottom:10px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.card.closed{opacity:.6}
.card.applied{border-left:4px solid var(--done)}
.title{font-weight:600;font-size:16px;line-height:1.35;text-decoration:none;overflow-wrap:anywhere}
.title:hover{text-decoration:underline}
.company{color:var(--muted);font-size:14px}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.loc{color:var(--ink);font-weight:500}
.pill.new{background:var(--new-soft);color:var(--new);border-color:transparent;font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.closed{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.pill.done{background:var(--done-soft);color:var(--done);border-color:transparent;font-weight:600}
.actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.icon{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.icon.on.star{color:var(--star);border-color:var(--star)}
.icon.on.check{color:var(--done);border-color:var(--done)}
.icon.hide:hover{color:var(--accent);border-color:var(--accent)}
.card.hidden{opacity:.55}
.undo{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:var(--shadow);display:none;gap:12px;align-items:center;z-index:10;width:min(440px,calc(100% - 32px))}
.undo span{flex:1;min-width:0}
.undo button{background:none;border:0;color:var(--accent);font:600 14px Inter,sans-serif;cursor:pointer;padding:0}
.empty{text-align:center;color:var(--muted);padding:40px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:16px}
footer{margin-top:36px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
footer a{color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Deine Jobs <span>✦</span></h1>
    <div class="sub" id="stand">Lade …</div>
    <div class="stats">
      <div class="stat"><b id="sOpen">–</b><small>offen</small></div>
      <div class="stat"><b id="sNew">–</b><small>neu heute</small></div>
      <div class="stat"><b id="sStar">–</b><small>gemerkt</small></div>
      <div class="stat"><b id="sDone">–</b><small>beworben</small></div>
    </div>
  </header>

  <div class="controls">
    <div class="tabs" role="group" aria-label="Ansicht">
      <button class="tab" data-view="alle" aria-pressed="true">Alle</button>
      <button class="tab" data-view="gemerkt" aria-pressed="false">⭐ Gemerkt</button>
      <button class="tab" data-view="neu" aria-pressed="false">Neu (7 Tage)</button>
      <button class="tab" data-view="beworben" aria-pressed="false">✓ Beworben</button>
      <button class="tab" data-view="aussortiert" aria-pressed="false">✕ Aussortiert <span id="cHide"></span></button>
    </div>
    <div class="row">
      <select id="fRole" aria-label="Rolle"><option value="">Alle Rollen</option></select>
      <select id="fCity" aria-label="Ort"><option value="">Alle Orte</option></select>
      <input id="fText" type="search" placeholder="Suchen: Firma, Titel …" aria-label="Suchen">
    </div>
  </div>

  <main id="list"></main>
  <div class="undo" id="undo" role="status"><span id="undoText">Aussortiert.</span><button id="undoBtn">Rückgängig</button></div>

  <footer>
    Wird jeden Morgen automatisch aktualisiert. ⭐, ✓ und ✕ werden in diesem Browser gespeichert
    (auf dem Handy und am Rechner also getrennt).<br>
    <a href="https://github.com/marie-niemann/jobsammler/blob/main/initiativ/kontakte.md">Initiativ-Liste</a> ·
    <a href="https://github.com/marie-niemann/jobsammler/blob/main/initiativ/vorlage-initiativmail.md">Mail-Vorlage</a> ·
    <a href="https://github.com/marie-niemann/jobsammler/blob/main/QUELLEN.md">Quellen &amp; E-Mail-Alerts</a> ·
    <a href="https://github.com/marie-niemann/jobsammler/actions/workflows/collect.yml">Lauf von Hand starten</a>
  </footer>
</div>

<script>
const KEY = "jobsammler-merk-v1";
let store = { star: {}, done: {}, hide: {} };
try { store = Object.assign(store, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

let jobs = [], run = {}, view = "alle";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dDE = (iso) => iso ? iso.slice(0,10).split("-").reverse().join(".") : "";
const daysAgo = (iso) => iso ? Math.round((Date.parse(run.datum || new Date()) - Date.parse(iso)) / 864e5) : 999;

function cityOf(j) {
  if (j.ortRang <= 40) return (j.location || "").split(" | ")[0] || "?";
  if (j.ortRang === 50) return "Remote";
  if (j.ortRang === 60) return "Ort unbekannt";
  return "Andere Orte (kurzer Einsatz)";
}

function card(j) {
  const star = !!store.star[j.id], done = !!store.done[j.id], hidden = !!store.hide[j.id];
  const fresh = j.firstSeen === run.datum;
  const pills = [];
  if (!j.open) pills.push(`<span class="pill closed">geschlossen</span>`);
  if (fresh) pills.push(`<span class="pill new">Neu</span>`);
  if (done) pills.push(`<span class="pill done">beworben ${esc(dDE(store.done[j.id]))}</span>`);
  pills.push(`<span class="pill loc">📍 ${esc(j.location || "Ort unbekannt")}</span>`);
  if (j.remote) pills.push(`<span class="pill">remote möglich</span>`);
  if (j.art) pills.push(`<span class="pill">${esc(j.art)}</span>`);
  if (j.salary) pills.push(`<span class="pill">${esc(j.salary)}</span>`);
  if (j.hinweis) pills.push(`<span class="pill warn">${esc(j.hinweis === "Ort aus dem Anzeigentext" ? "Ort geschätzt" : j.hinweis)}</span>`);
  pills.push(`<span class="pill">${esc(j.source)}${j.published ? " · " + esc(dDE(j.published)) : ""}</span>`);
  return `<article class="card${j.open ? "" : " closed"}${done ? " applied" : ""}${hidden ? " hidden" : ""}">
    <div><a class="title" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
      <div class="company">${esc(j.company)}</div></div>
    <div class="actions">
      <button class="icon star${star ? " on" : ""}" data-star="${esc(j.id)}" aria-label="Merken" title="Merken">${star ? "★" : "☆"}</button>
      <button class="icon check${done ? " on" : ""}" data-done="${esc(j.id)}" aria-label="Beworben" title="Als beworben markieren">✓</button>
      <button class="icon hide" data-hide="${esc(j.id)}" aria-label="${hidden ? "Zurückholen" : "Aussortieren"}" title="${hidden ? "Zurückholen" : "Aussortieren"}">${hidden ? "↺" : "✕"}</button>
    </div>
    <div class="meta">${pills.join("")}</div>
  </article>`;
}

function render() {
  const role = $("#fRole").value, city = $("#fCity").value, q = $("#fText").value.trim().toLowerCase();
  let list = jobs.filter(j => {
    if (view === "aussortiert") { if (!store.hide[j.id]) return false; }
    else if (store.hide[j.id]) return false;
    if (view === "alle" && !j.open) return false;
    if (view === "gemerkt" && !store.star[j.id]) return false;
    if (view === "neu" && !(j.open && daysAgo(j.firstSeen) <= 7)) return false;
    if (view === "beworben" && !store.done[j.id]) return false;
    if (role && j.rolle !== role) return false;
    if (city && cityOf(j) !== city) return false;
    if (q && !(`${j.title} ${j.company} ${j.location}`.toLowerCase().includes(q))) return false;
    return true;
  });
  // Gemerkte zuerst, dann Rolle, dann Ort, dann neueste
  list.sort((a, b) => (!!store.star[b.id] - !!store.star[a.id]) || (a.prio - b.prio) || (a.ortRang - b.ortRang) ||
    String(b.firstSeen).localeCompare(String(a.firstSeen)));
  $("#sStar").textContent = Object.keys(store.star).length;
  $("#sDone").textContent = Object.keys(store.done).length;
  const nh = jobs.filter(j => store.hide[j.id]).length;
  $("#cHide").textContent = nh ? `(${nh})` : "";
  if (!list.length) {
    const msg = { gemerkt: "Noch nichts gemerkt. Tippe bei einer Stelle auf ☆.", beworben: "Noch keine Bewerbung markiert. Tippe bei einer Stelle auf ✓.",
                  neu: "In den letzten 7 Tagen kam nichts Neues dazu.",
                  aussortiert: "Nichts aussortiert. Mit ✕ bei einer Stelle verschwindet sie aus der Liste." }[view] || "Keine Stellen für diese Auswahl.";
    $("#list").innerHTML = `<div class="empty">${msg}</div>`; return;
  }
  const pinned = list.filter(j => store.star[j.id] && view === "alle");
  const rest = list.filter(j => !(store.star[j.id] && view === "alle"));
  let html = "";
  if (pinned.length) html += `<h2>⭐ Angepinnt <span class="count">${pinned.length}</span></h2>` + pinned.map(card).join("");
  const groups = new Map();
  rest.forEach(j => { if (!groups.has(j.rolle)) groups.set(j.rolle, []); groups.get(j.rolle).push(j); });
  for (const [r, items] of groups) html += `<h2>${esc(r)} <span class="count">${items.length}</span></h2>` + items.map(card).join("");
  $("#list").innerHTML = html;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-view],[data-star],[data-done],[data-hide]");
  if (!t) return;
  if (t.dataset.view) {
    view = t.dataset.view;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", b === t));
  } else if (t.dataset.star) {
    const id = t.dataset.star; store.star[id] ? delete store.star[id] : (store.star[id] = new Date().toISOString().slice(0,10)); save();
  } else if (t.dataset.hide) {
    const id = t.dataset.hide;
    if (store.hide[id]) { delete store.hide[id]; } else { store.hide[id] = new Date().toISOString().slice(0,10); showUndo(id); }
    save();
  } else if (t.dataset.done) {
    const id = t.dataset.done; store.done[id] ? delete store.done[id] : (store.done[id] = new Date().toISOString().slice(0,10)); save();
  }
  render();
});
let undoTimer = null, lastHidden = null;
function showUndo(id) {
  lastHidden = id;
  const j = jobs.find(x => x.id === id);
  $("#undoText").textContent = `„${(j ? j.title : "Stelle").slice(0, 40)}“ aussortiert.`;
  $("#undo").style.display = "flex";
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { $("#undo").style.display = "none"; }, 5000);
}
$("#undoBtn").addEventListener("click", () => {
  if (lastHidden) { delete store.hide[lastHidden]; save(); }
  $("#undo").style.display = "none"; render();
});

["#fRole", "#fCity", "#fText"].forEach(s => $(s).addEventListener("input", render));

Promise.all([fetch("jobs.json", {cache: "no-store"}).then(r => r.json()), fetch("run.json", {cache: "no-store"}).then(r => r.json()).catch(() => ({}))])
  .then(([j, r]) => {
    jobs = j; run = r;
    const open = jobs.filter(x => x.open);
    $("#sOpen").textContent = open.length;
    $("#sNew").textContent = open.filter(x => x.firstSeen === run.datum).length;
    $("#stand").textContent = `Stand: ${dDE(run.datum)}${run.gestartet ? ", " + run.gestartet.slice(11,16) + " Uhr" : ""} · Moderation · Host · Entertainment`;
    const roles = [...new Map(jobs.map(x => [x.rolle, x.prio])).entries()].sort((a, b) => a[1] - b[1]).map(x => x[0]);
    roles.forEach(r => $("#fRole").insertAdjacentHTML("beforeend", `<option>${esc(r)}</option>`));
    const order = (c) => { const j = jobs.find(x => cityOf(x) === c); return j ? j.ortRang : 99; };
    [...new Set(jobs.map(cityOf))].sort((a, b) => order(a) - order(b)).forEach(c => $("#fCity").insertAdjacentHTML("beforeend", `<option>${esc(c)}</option>`));
    render();
  })
  .catch(() => { $("#list").innerHTML = `<div class="empty">Die Stellen konnten nicht geladen werden. Bitte später neu laden.</div>`; });
</script>
</body>
</html>
