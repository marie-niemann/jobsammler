name: Stellen sammeln

on:
  schedule:
    - cron: "17 4 * * *"   # täglich 04:17 UTC = 05:17 Uhr Winterzeit / 06:17 Uhr Sommerzeit in Deutschland
  workflow_dispatch:        # von Hand startbar über "Run workflow"
  push:                     # und sofort nach jeder Änderung an Einstellungen oder Programm
    paths:
      - "config/**"
      - "sources/**"
      - "collect.py"
      - "web/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write           # damit der Lauf data/ ins Repository schreiben darf
  pages: write              # damit die Job-Webseite aktualisiert werden darf
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Stellen sammeln
        run: python collect.py

      - name: Ergebnis ins Repository schreiben
        run: |
          git config user.name "jobsammler-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Stellen vom $(TZ=Europe/Berlin date +%d.%m.%Y)"
            git pull --rebase -q
            git push
          fi

      - name: Job-Webseite vorbereiten
        run: |
          mkdir -p _site
          cp web/index.html data/jobs.json data/run.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  webseite:
    # Veröffentlicht die Job-Webseite über GitHub Pages.
    # Einmalig nötig: Settings -> Pages -> Source: "GitHub Actions".
    # Solange Pages nicht eingeschaltet ist, schlägt nur dieser Schritt fehl; das Sammeln selbst klappt trotzdem.
    needs: collect
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
