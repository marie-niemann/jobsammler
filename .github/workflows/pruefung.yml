name: Quellen prüfen (einmalig)

# Läuft, sobald sich etwas im Ordner pruefung/ ändert (außer den Ergebnissen),
# oder von Hand über "Run workflow".
on:
  push:
    paths:
      - "pruefung/probe.py"
      - "pruefung/ziele.yaml"
      - ".github/workflows/pruefung.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests PyYAML
      - run: python pruefung/probe.py
      - name: Ergebnis speichern
        run: |
          git config user.name "jobsammler-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pruefung/ergebnis
          git commit -m "Prüf-Ergebnis $(date -u +%F)" || echo "nichts neu"
          git pull --rebase -q && git push
