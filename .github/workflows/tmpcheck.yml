name: tmpcheck
on:
  push:
    paths: ["tmpcheck/get.py"]
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python tmpcheck/get.py
      - run: |
          git config user.name "jobsammler-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmpcheck/dwdl_alle.html && git commit -m "tmp" && for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
