name: Recherche Initiativbewerbungen (einmalig)

on:
  push:
    paths:
      - "recherche/recherche.py"
      - "recherche/kandidaten.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests PyYAML
      - run: python recherche/recherche.py
      - name: Ergebnis speichern
        run: |
          git config user.name "jobsammler-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recherche/ergebnis.json
          git commit -m "Recherche-Ergebnis $(date -u +%F)" || echo "nichts neu"
          git pull --rebase -q && git push
