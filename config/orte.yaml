# Wo die Stelle sein darf.

# Wunschorte, in dieser Reihenfolge sortiert (der erste steht in der Liste oben).
# Jeder Ort kann mehrere Schreibweisen haben (mit | getrennt).
# "nur_firmen": Der Ort gilt nur für Stellen dieser Firmen (Firmenname oder Titel enthält eines der Wörter).
wunschorte:
  - name: Berlin
    muster: berlin|potsdam
  - name: München
    muster: münchen|muenchen|munich|unterföhring|unterfoehring|ismaning|grünwald|gruenwald
  - name: Hamburg
    muster: hamburg
  - name: Hannover
    muster: hannover|hanover
  - name: Frankfurt
    muster: frankfurt(?! ?\(? ?oder)|offenbach|eschborn
  # Köln nur beim WDR (inkl. 1LIVE, WDR 2, WDR 4, WDR 5, COSMO)
  - name: Köln (WDR)
    muster: köln|koeln|cologne
    nur_firmen: wdr|westdeutscher rundfunk|1live|einslive|cosmo

# Stellen in anderen Orten kommen nur in die Liste, wenn sie remote sind
# oder eines dieser Wörter im Titel oder in der Beschreibung steht (kurze Einsätze).
# Es zählen nur ganze Wörter: "gage" trifft "Gage", aber nicht "Engagement".
kurzzeit_woerter:
  - casting
  - drehtag
  - drehtage
  - dreharbeiten
  - wochenweise
  - tageweise
  - tagesgage
  - gage
  - gagen
  - projektbasis
  - projektweise
  - für ein projekt
  - einzelne termine
  - einzelne events
  - event
  - events
  - eventmoderation
  - castings
  - castingshow
  - castingaufruf
  - castingcall
  - messe
  - tournee
  - tour
  - gastauftritt
  - pilotfolge
  - pilot

# Wörter, an denen eine Remote-Stelle erkannt wird
remote_woerter:
  - remote
  - homeoffice
  - home office
  - home-office
  - mobiles arbeiten
  - ortsunabhängig
  - deutschlandweit
  - bundesweit
