  # --- Private Sender und Streaming ---
  - name: ProSiebenSat.1 (mit Joyn, Seven.One, Studio71, Redseven)
    art: successfactors
    url: https://jobs.prosiebensat1.com/search/?q=&locale=de_DE
  - name: RTL Deutschland
