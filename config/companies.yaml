    ort: Köln
  - name: ITV Studios Germany
    art: personio
    url: https://itv-studios-germany.jobs.personio.de/xml
    ort: Köln

alerts:
  - name: Raab Entertainment
    grund: robots.txt sperrt automatische Programme
    wo: https://jobs.raab-entertainment.de/stellenangebote.html
  - name: florida entertainment
    grund: Website für Programme nicht erreichbar
    wo: Karriereseite / LinkedIn der Firma
  - name: Constantin Entertainment
    grund: keine abrufbare Stellenliste; Castings laufen über eigene Casting-Seite
    wo: https://constantin-entertainment.de/karriere/ und https://www.constantin-casting.de
  - name: Bavaria Film / Bavaria Entertainment
    grund: Stellenliste wird nachgeladen, keine offene Schnittstelle gefunden
    wo: https://www.bavaria-film.de/jobportal
  - name: WDR
    grund: eigenes Bewerbungsportal, Stellenliste nicht verlässlich lesbar
    wo: https://karriere.wdr.de
  - name: Rocket Beans TV
    grund: Website nur mit JavaScript
    wo: https://rocketbeans.tv/jobs
  - name: Hyperbole
    grund: keine Stellenliste
    wo: https://www.hyperbole.de/jobs/
  - name: Mediakraft
    grund: Website für Programme nicht erreichbar
    wo: Website / LinkedIn
  - name: Netflix
    grund: robots.txt verbietet automatisches Abrufen
    wo: https://jobs.netflix.com
  - name: Amazon (Prime Video)
    grund: keine offizielle Schnittstelle
    wo: https://www.amazon.jobs (Job-Alert)
  - name: Disney
    grund: Seite nur mit JavaScript
    wo: https://join.disneycareers.com (Job-Alert)
  - name: Warner Bros. Discovery
    grund: Seite nur mit JavaScript
    wo: https://careers.wbd.com (Job-Alert)
  - name: Sky Deutschland
    grund: blockt automatische Zugriffe
    wo: https://www.sky.de (Karriere, Job-Alert)
  - name: DAZN
    grund: blockt automatische Zugriffe
    wo: https://www.dazn.com (Careers, Job-Alert)
  - name: e-TALENTA (früher Castforward)
    grund: Castings nur mit Profil; automatisches Auslesen nicht erlaubt
    wo: https://www.etalenta.eu (Profil + Casting-Benachrichtigung)
  - name: filmmakers
    grund: Nutzungsbedingungen verbieten automatisches Auslesen
    wo: https://www.filmmakers.eu (Profil + Benachrichtigung)
  - name: Schauspielervideos
    grund: robots.txt verbietet alles
    wo: https://www.schauspielervideos.de (Castings, Benachrichtigung)
  - name: Crew United
    grund: Jobinserate nur mit Login
    wo: https://www.crew-united.com/de/jobs/
  - name: kress / MEEDIA
    grund: wird größtenteils über den newsroom.de-Feed abgedeckt
    wo: https://kress.de/jobs/stellenmarkt (Job-Newsletter)
