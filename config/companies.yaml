# Zielfirmen, Sender und Jobbörsen.
#
# Teil 1 "quellen": wird jeden Morgen automatisch abgerufen.
#   name:  wie die Firma in der Liste heißen soll
#   art:   wie die Seite gelesen wird (nicht ändern, wenn du nicht sicher bist):
#          rss            = RSS-Feed
#          personio       = offizielle Personio-Stellenliste (XML)
#          softgarden     = öffentliche softgarden-Stellenliste
#          umantis        = öffentliche umantis-Stellenliste
#          successfactors = öffentliche Stellensuche (SAP SuccessFactors)
#          ufa            = Stellenliste auf ufa.de
#          hr             = Stellenliste auf hr.de
#          dwdl           = Jobbörse von DWDL.de
#   url:   Adresse der Stellenliste
#   ort:   Ort, falls die Quelle keinen Ort nennt
#   firma_aus_titel: true = Titel lautet "Firma sucht Stelle" (Firma wird abgetrennt)
#   max_alter_tage: 60    = ältere Anzeigen ignorieren
#   aus: true  = vorübergehend nicht abrufen (Zeile "aus: true" löschen, um wieder einzuschalten)
#
# Vor jedem Abruf prüft das Programm die robots.txt der Seite. Verbietet sie den Abruf,
# wird die Quelle übersprungen und das steht im Protokoll (data/run.json).
#
# Teil 2 "alerts": Firmen, die NICHT automatisch abgerufen werden dürfen oder können.
# Für diese richtest du am besten einen E-Mail-Jobalert ein. Die Liste steht auch in QUELLEN.md.

quellen:
  # --- Jobbörsen ---
  - name: newsroom.de
    art: rss
    url: https://www.newsroom.de/rss/jobs-feed/
  - name: RADIOSZENE
    art: rss
    url: https://www.radioszene.de/kategorie/jobs/stellenangebote/feed
    firma_aus_titel: true
    max_alter_tage: 60
  - name: DWDL.de
    art: dwdl
    url: https://www.dwdl.de/jobboerse/alle-anzeigen.html?typ=alle

  # --- Öffentlich-rechtliche Sender ---
  - name: rbb
    art: umantis
    url: https://recruitingapp-5154.de.umantis.com/Jobs/All
    ort: Berlin
  - name: NDR
    art: umantis
    url: https://jobs.ndr.de/Jobs/All
    ort: Hamburg
  - name: BR
    art: umantis
    url: https://jobs.br.de/Jobs/All
    ort: München
  - name: ZDF
    art: successfactors
    url: https://jobs.zdf.de/search/?q=&locale=de_DE
  - name: ZDF Digital
    art: personio
    url: https://zdf-digital.jobs.personio.de/xml
    ort: Mainz
  - name: Hessischer Rundfunk
    art: hr
    url: https://www.hr.de/karriere/alle-angebote/index.html
    ort: Frankfurt am Main
  - name: Deutschlandradio
    art: softgarden
    url: https://deutschlandradio.softgarden.io/de/vacancies
    ort: Köln
  - name: Radio Bremen
    art: softgarden
    url: https://radiobremen.softgarden.io/de/vacancies
    ort: Bremen
  - name: Saarländischer Rundfunk
    art: softgarden
    url: https://srjobs.softgarden.io/de/vacancies
    ort: Saarbrücken
  - name: NDR Karriere-Feed
    art: rss
    url: https://www.ndr.de/der_ndr/karriere/index~rss2.xml
    ort: Hamburg
  - name: ZDF Karriere-Feed
    art: rss
    url: https://www.zdf.de/rss/zdf/unternehmen/karriere
  - name: SWR und funk
    art: rss
    url: https://www.swr.de/~rss/unternehmen/karriere/stellenangebote-110.xml
  - name: MDR
    art: rss
    url: https://www.mdr.de/karriere/index~rss2.xml
    ort: Leipzig
  - name: BR Karriere-Feed
    art: rss
    url: https://www.br.de/extra/karriere/karriere-ausbildung-werkstudenten-duales-studium-jobs-stellenmarkt-stellenangebote-100~rss.xml
    ort: München
  - name: ARD Programmdirektion
    art: rss
    url: https://www.ard.de/die-ard/ard-programmdirektion/uebersicht-ard-programmdirektion-jobs-100~rss2.xml
