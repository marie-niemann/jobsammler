# Rollen und Suchbegriffe.
#
# So funktioniert ein Suchbegriff: Er passt, wenn ALLE seine Wörter im Stellentitel vorkommen.
# Groß-/Kleinschreibung und Endungen wie -in, -innen, /in, (m/w/d) sind egal.
#   "Moderator"       passt auf "Moderatorin (m/w/d)", "TV-Moderator", "Moderator/in Hörfunk"
#   "Moderation TV"   passt nur, wenn "Moderation" UND "TV" im Titel stehen
# Lange Wörter (ab 9 Buchstaben) passen auch als Wortanfang: "Formatentwicklung" trifft "Formatentwicklungs-Team".
#
# prio: 1 = am wichtigsten (steht in der Liste oben), 3 = am wenigsten wichtig
# ohne: Wörter, bei denen ein Treffer für DIESE Rolle doch nicht zählt
# suche_ba: Begriffe, mit denen bei der Arbeitsagentur gesucht wird (dort ist die Suche ungenau,
#           deshalb wenige, eindeutige Wörter). Gefiltert wird danach immer mit "terms".
#
# Neue Suchbegriffe einfach als neue Zeile mit "- " ergänzen. Einrückung (Leerzeichen) beibehalten!

